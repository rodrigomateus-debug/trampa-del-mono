<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><title>Equipo 5 · SDGA</title>
<defs>
  <path id="arriba" d="M36 100A64 64 0 0 1 164 100"/>
  <path id="abajo" d="M29 100A71 71 0 0 0 171 100"/>
  <!-- oro de medalla: oscuro, claro, brillo, claro, oscuro -->
  <linearGradient id="oro" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="190">
    <stop offset="0" stop-color="#8a6a1c"/><stop offset=".22" stop-color="#f3d27a"/><stop offset=".36" stop-color="#fff4c8"/>
    <stop offset=".5" stop-color="#e8c34a"/><stop offset=".72" stop-color="#a87d1e"/><stop offset=".88" stop-color="#f3d27a"/><stop offset="1" stop-color="#8a6a1c"/>
  </linearGradient>
  <linearGradient id="oro5" gradientUnits="userSpaceOnUse" x1="70" y1="55" x2="140" y2="160">
    <stop offset="0" stop-color="#fff4c8"/><stop offset=".3" stop-color="#f3d27a"/><stop offset=".55" stop-color="#e8c34a"/><stop offset=".8" stop-color="#b8892a"/><stop offset="1" stop-color="#f3d27a"/>
  </linearGradient>
  <radialGradient id="verde" cx="44%" cy="36%" r="70%"><stop offset="0" stop-color="#2e7d4f"/><stop offset=".55" stop-color="#1c5638"/><stop offset="1" stop-color="#0c2b1c"/></radialGradient>
  <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="medalla"><circle cx="100" cy="100" r="95"/></clipPath>
  <style>
    .t { font-family: Anton, Impact, "Arial Narrow Bold", "Arial Black", sans-serif; font-weight: 900; fill: url(#oro); stroke: #0c2b1c; stroke-width: .6; text-anchor: middle; }
    /* el brillo de medalla que cruza cada tanto */
    .barre { animation: barre 3.6s ease-in-out infinite; }
    @keyframes barre { 0% { transform: translateX(-260px) rotate(25deg); } 45%, 100% { transform: translateX(260px) rotate(25deg); } }
    /* destellos */
    .chispa { transform-box: fill-box; transform-origin: center; animation: chispa 3.6s ease-in-out infinite; }
    .chispa.dos { animation-delay: 1.4s; }
    @keyframes chispa { 0%, 30%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 40% { opacity: 1; transform: scale(1) rotate(45deg); } 52% { opacity: 0; transform: scale(.3) rotate(90deg); } }
    /* la pelota late, despacito */
    .bola { transform-origin: 103px 117px; animation: bola 3.6s ease-in-out infinite; }
    @keyframes bola { 0%, 70%, 100% { transform: none; } 80% { transform: scale(1.15); } 90% { transform: scale(.97); } }
  </style>
</defs>
<!-- el canto de la medalla: tinta, oro y el estriado de moneda -->
<circle cx="100" cy="100" r="99" fill="#0c2b1c"/>
<circle cx="100" cy="100" r="95" fill="url(#oro)"/>
<circle cx="100" cy="100" r="92" fill="none" stroke="#6b4f12" stroke-opacity=".55" stroke-width="5" stroke-dasharray="1.3 2.3"/>
<circle cx="100" cy="100" r="88" fill="#0c2b1c"/>
<circle cx="100" cy="100" r="86" fill="url(#verde)"/>
<circle cx="100" cy="100" r="80" fill="none" stroke="url(#oro)" stroke-width="2"/>
<text class="t" font-size="20" letter-spacing="4"><textPath href="#arriba" startOffset="50%">EQUIPO</textPath></text>
<text class="t" font-size="15" letter-spacing="7"><textPath href="#abajo" startOffset="50%">SDGA</textPath></text>
<g fill="url(#oro)" stroke="#0c2b1c" stroke-width="1.4" stroke-linejoin="round">
  <path d="M30 92l3 6.2 6.8.9-4.9 4.7 1.1 6.8-6-3.2-6 3.2 1.1-6.8-4.9-4.7 6.8-.9z"/>
  <path d="M170 92l3 6.2 6.8.9-4.9 4.7 1.1 6.8-6-3.2-6 3.2 1.1-6.8-4.9-4.7 6.8-.9z"/>
</g>
<!-- el 5 en oro, con relieve: sombra, borde, oro y una luz arriba -->
<g transform="translate(13 12) scale(.86)">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M128 64H88L84 96C92 90 101 88 109 89C125 91 135 103 135 118C135 136 121 148 103 148C89 148 77 142 71 132" stroke="#06170e" stroke-opacity=".7" stroke-width="27" transform="translate(4 5)"/>
  <path d="M128 64H88L84 96C92 90 101 88 109 89C125 91 135 103 135 118C135 136 121 148 103 148C89 148 77 142 71 132" stroke="#0c2b1c" stroke-width="27"/>
  <path d="M128 64H88L84 96C92 90 101 88 109 89C125 91 135 103 135 118C135 136 121 148 103 148C89 148 77 142 71 132" stroke="url(#oro5)" stroke-width="19"/>
  <path d="M128 64H88L84 96C92 90 101 88 109 89C125 91 135 103 135 118C135 136 121 148 103 148C89 148 77 142 71 132" stroke="#fff8dc" stroke-opacity=".55" stroke-width="3" transform="translate(-2.5 -3)"/>
</g>
<!-- la pelota, en la panza del 5 -->
<g class="bola">
  <circle cx="103" cy="117" r="10.5" fill="#ffffff" stroke="#0c2b1c" stroke-width="2.6"/>
  <g fill="#c9ccd1"><circle cx="99" cy="113" r="1.6"/><circle cx="105" cy="112" r="1.6"/><circle cx="108" cy="118" r="1.6"/><circle cx="101" cy="120" r="1.6"/><circle cx="97" cy="117" r="1.4"/><circle cx="104" cy="123" r="1.4"/></g>
</g>
</g>
<!-- el brillo que cruza la medalla -->
<g clip-path="url(#medalla)"><rect class="barre" x="70" y="-60" width="34" height="320" fill="url(#brillo)"/></g>
<!-- destellos -->
<g fill="#fffbe8">
  <path class="chispa" d="M156 140l2.5 7.5 7.5 2.5-7.5 2.5-2.5 7.5-2.5-7.5-7.5-2.5 7.5-2.5z"/>
  <path class="chispa dos" d="M42 136l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
</g>
</svg>
